<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級成績與表現填報系統</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --border: #dcdfe6;
      --text: #2c3e50;
      --text-muted: #606266;
      --danger: #e53935;
      --warning: #f59e0b;
      --success: #2e7d32;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 30px 15px;
    }
    .card {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 28px 36px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h2 { margin: 0; color: var(--primary); font-size: 22px; }
    .hidden { display: none !important; }
    
    .login-box {
      text-align: center;
      padding: 40px 20px;
    }
    .login-box p {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 15px;
    }

    .notice-card {
      border-radius: 8px;
      padding: 24px;
      margin-top: 15px;
      text-align: center;
    }
    .card-danger {
      border: 1px solid #fecaca;
      background-color: #fef2f2;
      color: #991b1b;
    }
    .card-pending {
      border: 1px solid #bfdbfe;
      background-color: #eff6ff;
      color: #1e40af;
    }
    .card-apply {
      border: 1px solid #fed7aa;
      background-color: #fffbeb;
      text-align: left;
    }
    
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-weight: 600; font-size: 14px; }
    select, input[type="text"], input[type="number"], input[type="password"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .student-panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fafbfc;
      padding: 12px;
    }
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .student-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .student-item:hover { border-color: var(--primary); background: #f0f7ff; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>班級成績與表現填報系統</h2>
    <div id="userInfo" class="hidden" style="display:flex; align-items:center; gap:12px;">
      <span id="userEmailSpan" style="font-size:14px; font-weight:600; color:var(--text-muted);"></span>
      <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 1. Google 登入按鈕 -->
  <div id="loginView" class="login-box">
    <p>本系統僅供學校教職員登入填報，請使用學校 Google 帳號登入：</p>
    <div style="display: flex; justify-content: center;">
      <div id="g_id_onload"
           data-client_id="341910377782-3unva3oggi84vp88uga23horpumjaptt.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="continue_with"
           data-size="large"
           data-logo_alignment="center">
      </div>
    </div>
  </div>

  <!-- 2. 身分狀態展示 (全域閘門) -->
  <div id="statusContainer" class="hidden">
    <!-- 學生帳號直接攔截警告 -->
    <div id="studentBlockedCard" class="notice-card card-danger hidden">
      <h3 style="margin-top:0;">🚫 存取受限：偵測到學生身分帳號</h3>
      <p>本系統僅限本校教職員登入，學生帳號無權存取與申請。</p>
      <button class="btn btn-danger" onclick="logout()">切換其他帳號</button>
    </div>

    <!-- 待審核中提示 -->
    <div id="pendingCard" class="notice-card card-pending hidden">
      <h3 style="margin-top:0;">⌛ 權限審核中</h3>
      <p>老師您好，您的教職員使用申請已送交管理者 (<code>chienmu.tai@dhips.ttct.edu.tw</code>)。</p>
      <p style="font-size:13px; color:#475569;">管理者於系統核准並產生專屬通行碼 (UUID) 後，重新整理本頁即可直接登入填報。</p>
    </div>

    <!-- 首次使用：教師申請表單 -->
    <div id="applyCard" class="notice-card card-apply hidden">
      <h3 style="margin-top:0; color:#b45309;">📋 教職員使用權限申請</h3>
      <p style="font-size:14px; color:#666; margin-bottom:16px;">
        帳號 (<strong><span id="applyEmailSpan"></span></strong>) 尚未取得授權，請填寫申請資訊以供管理者審核：
      </p>

      <div class="form-group">
        <label for="applyTeacherName">教師姓名：</label>
        <input type="text" id="applyTeacherName" placeholder="例如：林大明 老師" />
      </div>

      <div class="form-group">
        <label for="applyInviteCode">校內教職員申請代碼 (防學生誤填)：</label>
        <input type="password" id="applyInviteCode" placeholder="請輸入校內通行代碼 (如 DHIPS-TEACHER)" />
      </div>

      <div class="form-group">
        <label for="applyReason">身分 / 備註：</label>
        <input type="text" id="applyReason" placeholder="例如：101班導師、自然科任等" />
      </div>

      <button class="btn btn-warning" id="applySubmitBtn" style="width:100%;" onclick="sendTeacherApplication()">送出教職員使用申請</button>
    </div>
  </div>

  <!-- 3. 已核准老師：填報主系統 (未核准前此區完全隔離) -->
  <div id="mainSystem" class="hidden">
    <!-- 授權徽章 -->
    <div class="auth-badge">
      <span>✔ 教師授權已通過</span>
      <span style="color:#666;">| 通行 UUID:</span>
      <code id="userUuidSpan" style="font-weight:bold;"></code>
    </div>

    <div class="form-group">
      <label for="classSelect">步驟一：請選擇填報班級</label>
      <select id="classSelect" onchange="onClassSelected()">
        <option value="">-- 請選擇班級 --</option>
      </select>
    </div>

    <div id="reportingFields" class="hidden" style="margin-top: 15px;">
      <div class="grid-2">
        <div class="form-group">
          <label for="itemSelect">步驟二：填報項目</label>
          <select id="itemSelect"><option value="">-- 載入中 --</option></select>
        </div>
        <div class="form-group">
          <label for="scoreInput">步驟三：成績表現 (點數/數值)</label>
          <input type="number" id="scoreInput" placeholder="例如：5 或 90" />
        </div>
      </div>

      <div class="form-group">
        <label for="noteInput">備註說明 (選填)</label>
        <input type="text" id="noteInput" placeholder="例如：期中表現優異" />
      </div>

      <!-- 學生勾選名單 -->
      <div class="form-group">
        <div class="student-panel">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="margin:0;">步驟四：勾選受評學生名單</label>
            <button type="button" class="btn" style="padding:3px 8px; font-size:12px; background:#e2e8f0;" onclick="toggleAllStudents()">全選 / 取消全選</button>
          </div>
          <div id="studentGrid" class="student-grid"></div>
        </div>
      </div>

      <div style="text-align: right; margin-top: 20px;">
        <button class="btn btn-primary" id="submitBtn" onclick="submitScores()">確認送出並寫入試算表</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 請置換為您的獨立 Apps Script Web App 部署網址
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfiNLmE_kg8Lc4v0OLimkdQ5gmu54ym3CXDnuUY4jtH9EgkxJt7Z54-STlhcF7YxIUDQ/exec";

  let currentUser = { email: "", name: "" };
  let isAllSelected = false;

  // 1. Google 登入處理
  function handleCredentialResponse(response) {
    const payload = decodeJwtResponse(response.credential);
    currentUser.email = payload.email.toLowerCase();
    currentUser.name = payload.name || payload.email.split("@")[0];

    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("userInfo").classList.remove("hidden");
    document.getElementById("userEmailSpan").textContent = `${currentUser.name} (${currentUser.email})`;

    // 前端第一層防護：檢查是否符合學號特徵 (數字開頭或 s/stu 接數字)
    if (/^([0-9]|s[0-9]|stu[0-9])/i.test(currentUser.email.split("@")[0])) {
      document.getElementById("statusContainer").classList.remove("hidden");
      document.getElementById("studentBlockedCard").classList.remove("hidden");
      return;
    }

    // 向後端執行全域身分查驗
    verifyGlobalAuth();
  }

  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }

  function logout() {
    currentUser = { email: "", name: "" };
    location.reload();
  }

  // 2. 向後端確認身分狀態
  async function verifyGlobalAuth() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=checkGlobalAuth&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();

      if (json.status !== "success") {
        alert(json.message);
        return;
      }

      const auth = json.auth;
      const statusContainer = document.getElementById("statusContainer");

      if (auth.isAuthorized) {
        // 已通過核准：解鎖主填報介面
        statusContainer.classList.add("hidden");
        document.getElementById("mainSystem").classList.remove("hidden");
        document.getElementById("userUuidSpan").textContent = auth.uuid;
        loadClassList();
      } else {
        // 未通過核准
        statusContainer.classList.remove("hidden");
        if (auth.status === "PENDING") {
          document.getElementById("pendingCard").classList.remove("hidden");
        } else {
          // 未申請過：顯示申請卡片
          document.getElementById("applyEmailSpan").textContent = currentUser.email;
          document.getElementById("applyTeacherName").value = currentUser.name;
          document.getElementById("applyCard").classList.remove("hidden");
        }
      }
    } catch (e) {
      alert("身分連線查驗失敗，請稍後再試！");
    }
  }

  // 3. 送出教職員申請
  async function sendTeacherApplication() {
    const teacherName = document.getElementById("applyTeacherName").value.trim();
    const inviteCode = document.getElementById("applyInviteCode").value.trim();
    const reason = document.getElementById("applyReason").value.trim();
    const btn = document.getElementById("applySubmitBtn");

    if (!teacherName) return alert("請填寫您的教師姓名！");
    if (!inviteCode) return alert("請輸入校內教職員申請代碼！");

    btn.disabled = true;
    btn.textContent = "傳送申請中...";

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "applyPermission",
          userEmail: currentUser.email,
          userName: teacherName,
          inviteCode: inviteCode,
          reason: reason
        })
      });
      const json = await res.json();
      if (json.status === "success") {
        alert(json.message);
        document.getElementById("applyCard").classList.add("hidden");
        document.getElementById("pendingCard").classList.remove("hidden");
      } else {
        alert(`申請失敗：${json.message}`);
      }
    } catch (e) {
      alert("申請送出發生異常，請重試！");
    } finally {
      btn.disabled = false;
      btn.textContent = "送出教職員使用申請";
    }
  }

  // 4. 載入班級選單 (僅限已核准身分)
  async function loadClassList() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getClasses&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();
      if (json.status === "success") {
        const sel = document.getElementById("classSelect");
        sel.innerHTML = '<option value="">-- 請選擇班級 --</option>';
        json.data.forEach(cls => {
          const opt = document.createElement("option");
          opt.value = cls;
          opt.textContent = `${cls} 班`;
          sel.appendChild(opt);
        });
      }
    } catch (e) {
      alert("載入班級失敗！");
    }
  }

  // 5. 選擇班級後讀取學生與項目
  async function onClassSelected() {
    const classId = document.getElementById("classSelect").value;
    const formPanel = document.getElementById("reportingFields");
    if (!classId) {
      formPanel.classList.add("hidden");
      return;
    }

    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getClassData&classId=${classId}&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();
      if (json.status !== "success") {
        alert(json.message);
        return;
      }

      const { status, items, students } = json.data;
      if (status === "暫停填報") {
        alert("⚠ 該班級目前為「暫停填報」狀態！");
        formPanel.classList.add("hidden");
        return;
      }

      // 渲染填報項目
      const itemSelect = document.getElementById("itemSelect");
      itemSelect.innerHTML = '<option value="">-- 請選擇項目 --</option>';
      items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name;
        opt.textContent = `${it.name} (上限: ${it.limit || '無'})`;
        itemSelect.appendChild(opt);
      });

      // 渲染學生名單
      const grid = document.getElementById("studentGrid");
      grid.innerHTML = "";
      students.forEach(st => {
        const lbl = document.createElement("label");
        lbl.className = "student-item";
        lbl.innerHTML = `
          <input type="checkbox" class="student-cb" value="${st.id}" data-name="${st.name}">
          <span>${st.id} ${st.name}</span>
        `;
        grid.appendChild(lbl);
      });

      formPanel.classList.remove("hidden");
    } catch (e) {
      alert("載入資料失敗！");
    }
  }

  function toggleAllStudents() {
    isAllSelected = !isAllSelected;
    document.querySelectorAll(".student-cb").forEach(cb => cb.checked = isAllSelected);
  }

  // 6. 送出成績
  async function submitScores() {
    const classId = document.getElementById("classSelect").value;
    const item = document.getElementById("itemSelect").value;
    const score = document.getElementById("scoreInput").value.trim();
    const note = document.getElementById("noteInput").value.trim();

    if (!item) return alert("請選擇填報項目！");
    if (!score) return alert("請輸入成績表現！");

    const checked = Array.from(document.querySelectorAll(".student-cb:checked"));
    if (checked.length === 0) return alert("請至少勾選一名學生！");

    const records = checked.map(cb => ({
      id: cb.value,
      name: cb.dataset.name,
      item: item,
      score: score,
      note: note
    }));

    if (!confirm(`確認送出 ${records.length} 筆資料至 ${classId} 班？`)) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "寫入試算表中...";

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitScores",
          userEmail: currentUser.email,
          classId: classId,
          records: records
        })
      });
      const json = await res.json();
      if (json.status === "success") {
        alert(`填報成功！已寫入 ${json.count} 筆資料至試算表。`);
        document.querySelectorAll(".student-cb").forEach(cb => cb.checked = false);
        document.getElementById("scoreInput").value = "";
        document.getElementById("noteInput").value = "";
      } else {
        alert(`寫入失敗：${json.message}`);
      }
    } catch (e) {
      alert("傳輸發生錯誤！");
    } finally {
      btn.disabled = false;
      btn.textContent = "確認送出並寫入試算表";
    }
  }
</script>

</body>
</html>
