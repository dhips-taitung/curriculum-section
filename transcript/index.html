<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級成績與表現填報系統</title>
  <!-- Google Identity Services (GIS) 登入函式庫 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --border: #dcdfe6;
      --text: #2c3e50;
      --text-muted: #606266;
      --danger: #e53935;
      --warning: #f59e0b;
      --success: #2e7d32;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 15px;
    }
    .card {
      max-width: 940px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 28px 36px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    h2 { margin: 0; color: var(--primary); font-size: 22px; }
    .hidden { display: none !important; }

    .login-box { text-align: center; padding: 40px 20px; }
    .login-box p { color: var(--text-muted); margin-bottom: 24px; font-size: 15px; }

    .notice-card { border-radius: 8px; padding: 20px; margin-top: 15px; text-align: center; }
    .card-danger { border: 1px solid #fecaca; background-color: #fef2f2; color: #991b1b; }
    .card-pending { border: 1px solid #bfdbfe; background-color: #eff6ff; color: #1e40af; }
    .card-apply { border: 1px solid #fed7aa; background-color: #fffbeb; text-align: left; }
    
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-weight: 600; font-size: 14px; }
    select, input[type="text"], input[type="password"] {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .record-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .record-table th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      padding: 10px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .record-table td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }
    .record-table select, .record-table input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
    }
    .btn-del {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-del:hover { background: #fecaca; }

    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; color: var(--primary); border: 1px dashed var(--primary); }
    .btn-outline:hover { background: #f0f7ff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .quota-box {
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .quota-full {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>班級成績與表現填報系統</h2>
    <div id="userInfo" class="hidden" style="display:flex; align-items:center; gap:12px;">
      <span id="userEmailSpan" style="font-size:14px; font-weight:600; color:var(--text-muted);"></span>
      <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 1. 未登入：Google 登入按鈕 -->
  <div id="loginView" class="login-box">
    <p>本系統僅供學校教職員登入填報，請使用學校 Google 帳號登入：</p>
    <div style="display: flex; justify-content: center;">
      <!-- ⭐ 請置換為您的 Google OAuth 用戶端 ID -->
      <div id="g_id_onload"
           data-client_id="341910377782-3unva3oggi84vp88uga23horpumjaptt.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="continue_with"
           data-size="large"
           data-logo_alignment="center">
      </div>
    </div>
  </div>

  <!-- 2. 身分查驗狀態區 -->
  <div id="statusContainer" class="hidden">
    <!-- 學生帳號自動攔截 -->
    <div id="studentBlockedCard" class="notice-card card-danger hidden">
      <h3 style="margin-top:0;">🚫 存取受限：偵測到學生身分帳號</h3>
      <p>本系統僅供學校教職員登入，學生帳號無權存取。</p>
      <button class="btn btn-danger" onclick="logout()">切換其他帳號</button>
    </div>

    <!-- 待審核中提示 -->
    <div id="pendingCard" class="notice-card card-pending hidden">
      <h3 style="margin-top:0;">⌛ 權限審核中</h3>
      <p>您的填報申請已送出，目前正等待管理者審核開通。</p>
      <p style="font-size:13px; color:#475569;">管理者點擊核准並產生專屬通行碼後，重新整理本頁即可直接填報。</p>
    </div>

    <!-- 未審核：教師申請表單 -->
    <div id="applyCard" class="notice-card card-apply hidden">
      <h3 style="margin-top:0; color:#b45309;">📋 教職員帳號班級綁定申請</h3>
      <p style="font-size:14px; color:#666; margin-bottom:14px;">帳號 (<strong><span id="applyEmailSpan"></span></strong>) 尚未取得授權：</p>
      
      <div class="form-group">
        <label for="applyTeacherName">教師姓名：</label>
        <input type="text" id="applyTeacherName" placeholder="例如：林大明 老師" />
      </div>

      <div class="form-group">
        <label for="applyTargetClass">請選擇任教班級 (自試算表即時載入，每人限綁定一班)：</label>
        <select id="applyTargetClass">
          <option value="">-- 載入全校班級清單中... --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="applyInviteCode">校內教職員申請代碼：</label>
        <input type="password" id="applyInviteCode" placeholder="請輸入通行代碼 (預設 DHIPS-TEACHER)" />
      </div>

      <div class="form-group">
        <label for="applyReason">身分備註 (選填)：</label>
        <input type="text" id="applyReason" placeholder="例如：導師" />
      </div>

      <button class="btn btn-warning" id="applySubmitBtn" style="width:100%;" onclick="sendTeacherApplication()">送出綁定申請</button>
    </div>
  </div>

  <!-- 3. 已核准主填報區 (未通過前完全隔離) -->
  <div id="mainSystem" class="hidden">
    <div class="auth-badge">
      <span>✔ 授權已核准</span>
      <span style="color:#666;">| 專屬班級:</span>
      <strong id="assignedClassBadge" style="color:#1e40af; font-size:14px;"></strong>
      <span style="color:#666;">| 通行碼:</span>
      <code id="userUuidSpan" style="font-weight:bold;"></code>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="classSelect">填報班級 (已綁定鎖定)</label>
        <select id="classSelect" onchange="onClassSelected()">
          <option value="">-- 載入中 --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemSelect">填報項目 (自「設定」工作表動態讀取)</label>
        <select id="itemSelect" onchange="onItemSelected()" disabled>
          <option value="">-- 請先確認班級 --</option>
        </select>
      </div>
    </div>

    <!-- 即時歷史名額與剩餘名額提示 -->
    <div id="quotaBox" class="quota-box hidden">
      <span id="quotaText"></span>
      <strong id="remainingBadge"></strong>
    </div>

    <!-- 個別指派學生與成績表現名單 -->
    <div id="recordSection" class="hidden" style="margin-top: 15px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <label style="font-size:15px;">指派獲獎學生與個別成績表現 (排名)</label>
        <button type="button" class="btn btn-outline" id="addRowBtn" onclick="addStudentRow()">+ 新增一位獲獎學生</button>
      </div>

      <table class="record-table">
        <thead>
          <tr>
            <th style="width: 5%;">#</th>
            <th style="width: 38%;">學生姓名 (學號)</th>
            <th style="width: 25%;">成績表現 (排名 1~上限)</th>
            <th style="width: 24%;">備註 (選填)</th>
            <th style="width: 8%; text-align:center;">刪除</th>
          </tr>
        </thead>
        <tbody id="recordTbody"></tbody>
      </table>

      <div style="text-align: right; margin-top: 24px;">
        <button class="btn btn-primary" id="submitBtn" style="padding:11px 24px; font-size:15px;" onclick="submitAllRecords()">確認送出並寫入試算表</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ⭐ 請置換為您的獨立 Apps Script Web App 部署網址
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfiNLmE_kg8Lc4v0OLimkdQ5gmu54ym3CXDnuUY4jtH9EgkxJt7Z54-STlhcF7YxIUDQ/exec";

  let currentUser = { email: "", name: "" };
  let currentClassData = null; // 包含 students(自學號查詢), items, scoreOptions, historyStats
  let currentItemLimit = 0;
  let currentRemaining = 0;
  let currentAwardedIds = [];

  // 1. Google 登入處理
  function handleCredentialResponse(response) {
    const payload = decodeJwtResponse(response.credential);
    currentUser.email = payload.email.toLowerCase();
    currentUser.name = payload.name || payload.email.split("@")[0];

    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("userInfo").classList.remove("hidden");
    document.getElementById("userEmailSpan").textContent = `${currentUser.name} (${currentUser.email})`;

    // 前端防線：判斷是否符合學號特徵 (純數字或 s/stu 接數字開頭)
    if (/^([0-9]|s[0-9]|stu[0-9])/i.test(currentUser.email.split("@")[0])) {
      document.getElementById("statusContainer").classList.remove("hidden");
      document.getElementById("studentBlockedCard").classList.remove("hidden");
      return;
    }

    verifyGlobalAuth();
  }

  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }

  function logout() {
    currentUser = { email: "", name: "" };
    location.reload();
  }

  // 2. 身分全域查驗
  async function verifyGlobalAuth() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=checkGlobalAuth&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();
      if (json.status !== "success") return alert(json.message);

      const auth = json.auth;
      const statusContainer = document.getElementById("statusContainer");

      if (auth.isAuthorized) {
        statusContainer.classList.add("hidden");
        document.getElementById("mainSystem").classList.remove("hidden");
        document.getElementById("userUuidSpan").textContent = auth.uuid;
        document.getElementById("assignedClassBadge").textContent = auth.role === "ADMIN" ? "全校班級 (管理者)" : `${auth.assignedClass} 班`;
        loadAssignedClasses(auth);
      } else {
        statusContainer.classList.remove("hidden");
        if (auth.status === "PENDING") {
          document.getElementById("pendingCard").classList.remove("hidden");
        } else {
          // 未申請過：顯示申請卡片，並動態抓取班級選單
          document.getElementById("applyEmailSpan").textContent = currentUser.email;
          document.getElementById("applyTeacherName").value = currentUser.name;
          loadApplicationClassOptions();
          document.getElementById("applyCard").classList.remove("hidden");
        }
      }
    } catch (e) {
      alert("連線驗證失敗，請檢查網路連線或後端設定！");
    }
  }

  // ⭐ 動態自後端「班級」工作表讀取全校班級選單 (供申請使用)
  async function loadApplicationClassOptions() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getAllClassList`);
      const json = await res.json();
      if (json.status === "success") {
        const sel = document.getElementById("applyTargetClass");
        sel.innerHTML = '<option value="">-- 請選擇班級 --</option>';
        json.data.forEach(cls => {
          const opt = document.createElement("option");
          opt.value = cls;
          opt.textContent = `${cls} 班`;
          sel.appendChild(opt);
        });
      }
    } catch (e) {
      console.error("載入申請班級清單失敗");
    }
  }

  // 3. 送出綁定申請
  async function sendTeacherApplication() {
    const teacherName = document.getElementById("applyTeacherName").value.trim();
    const targetClass = document.getElementById("applyTargetClass").value;
    const inviteCode = document.getElementById("applyInviteCode").value.trim();
    const reason = document.getElementById("applyReason").value.trim();
    const btn = document.getElementById("applySubmitBtn");

    if (!teacherName) return alert("請輸入教師姓名！");
    if (!targetClass) return alert("請選擇您要綁定的班級！");
    if (!inviteCode) return alert("請輸入校內教職員申請代碼！");

    btn.disabled = true;
    btn.textContent = "傳送申請中...";

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "applyPermission",
          userEmail: currentUser.email,
          userName: teacherName,
          targetClass: targetClass,
          inviteCode: inviteCode,
          reason: reason
        })
      });
      const json = await res.json();
      if (json.status === "success") {
        alert(json.message);
        document.getElementById("applyCard").classList.add("hidden");
        document.getElementById("pendingCard").classList.remove("hidden");
      } else {
        alert(`申請失敗：${json.message}`);
      }
    } catch (e) {
      alert("申請送出異常！");
    } finally {
      btn.disabled = false;
      btn.textContent = "送出綁定申請";
    }
  }

  // 4. 載入班級並鎖定 (一般老師自動選定專屬班級)
  async function loadAssignedClasses(auth) {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getClasses&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();
      if (json.status === "success") {
        const sel = document.getElementById("classSelect");
        sel.innerHTML = "";
        json.data.forEach(cls => {
          const opt = document.createElement("option");
          opt.value = cls;
          opt.textContent = `${cls} 班`;
          sel.appendChild(opt);
        });

        if (json.role === "TEACHER") {
          sel.value = auth.assignedClass;
          sel.disabled = true; // 鎖定不可改
          onClassSelected();
        } else {
          sel.disabled = false;
          onClassSelected();
        }
      }
    } catch (e) {
      alert("載入班級失敗！");
    }
  }

  // 5. 選擇班級：載入設定表項目、成績表現與學生
  async function onClassSelected() {
    const classId = document.getElementById("classSelect").value;
    const itemSelect = document.getElementById("itemSelect");
    const recordSection = document.getElementById("recordSection");
    const quotaBox = document.getElementById("quotaBox");

    itemSelect.disabled = true;
    itemSelect.innerHTML = '<option value="">-- 載入資料中... --</option>';
    recordSection.classList.add("hidden");
    quotaBox.classList.add("hidden");

    if (!classId) return;

    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getClassData&classId=${classId}&email=${encodeURIComponent(currentUser.email)}`);
      const json = await res.json();
      if (json.status !== "success") return alert(json.message);

      currentClassData = json.data;

      if (currentClassData.status === "暫停填報") {
        alert("⚠ 該班目前為「暫停填報」狀態！");
        return;
      }

      itemSelect.innerHTML = '<option value="">-- 請選擇填報項目 --</option>';
      currentClassData.items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name;
        opt.dataset.limit = it.maxLimit;
        opt.textContent = `${it.name} (上限 ${it.maxLimit} 人)`;
        itemSelect.appendChild(opt);
      });

      itemSelect.disabled = false;
    } catch (e) {
      alert("載入班級資料失敗！");
    }
  }

  // ⭐ 選擇項目：計算歷史累積、剩餘名額並動態過濾
  function onItemSelected() {
    const itemSelect = document.getElementById("itemSelect");
    const itemName = itemSelect.value;
    const recordSection = document.getElementById("recordSection");
    const quotaBox = document.getElementById("quotaBox");
    const quotaText = document.getElementById("quotaText");
    const remainingBadge = document.getElementById("remainingBadge");

    if (!itemName) {
      recordSection.classList.add("hidden");
      quotaBox.classList.add("hidden");
      return;
    }

    const selectedOpt = itemSelect.options[itemSelect.selectedIndex];
    currentItemLimit = Number(selectedOpt.dataset.limit) || 5;

    // 取得歷史填報統計
    const stat = currentClassData.historyStats[itemName] || { usedCount: 0, awardedIds: [] };
    const usedCount = stat.usedCount;
    currentAwardedIds = stat.awardedIds;
    currentRemaining = currentItemLimit - usedCount;

    quotaBox.classList.remove("hidden");
    if (currentRemaining <= 0) {
      quotaBox.className = "quota-box quota-full";
      quotaText.textContent = `【${itemName}】上限 ${currentItemLimit} 人 | 歷史已填報 ${usedCount} 人`;
      remainingBadge.textContent = "名額已額滿，無法再填報！";
      recordSection.classList.add("hidden");
      alert(`⚠【${itemName}】名額已全部額滿 (${usedCount}/${currentItemLimit})！`);
      return;
    } else {
      quotaBox.className = "quota-box";
      quotaText.textContent = `【${itemName}】上限 ${currentItemLimit} 人 | 歷史已填報 ${usedCount} 人`;
      remainingBadge.textContent = `尚餘名額：${currentRemaining} 人 (成績排名限 1~${currentItemLimit})`;
    }

    document.getElementById("recordTbody").innerHTML = "";
    addStudentRow();
    recordSection.classList.remove("hidden");
  }

  // ⭐ 新增一列：過濾已得獎學生、排名限制在 1 ~ currentItemLimit
  function addStudentRow() {
    const tbody = document.getElementById("recordTbody");
    const rowIndex = tbody.rows.length + 1;

    if (tbody.rows.length >= currentRemaining) {
      alert(`已達本次尚可填報的名額上限 (${currentRemaining} 人)，無法再新增！`);
      return;
    }

    const tr = document.createElement("tr");

    // 1. 學生下拉選單 (明確來自「學號查詢」工作表)
    let studentOptionsHtml = '<option value="">-- 請選擇學生 --</option>';
    currentClassData.students.forEach(st => {
      const isAwarded = currentAwardedIds.includes(st.id);
      if (isAwarded) {
        studentOptionsHtml += `<option value="${st.id}" data-name="${st.name}" disabled style="color:#94a3b8;">${st.id} ${st.name} (已獲此獎)</option>`;
      } else {
        studentOptionsHtml += `<option value="${st.id}" data-name="${st.name}">${st.id} ${st.name}</option>`;
      }
    });

    // 2. 成績表現選單 (縮限至 1 ~ currentItemLimit)
    let scoreOptionsHtml = '<option value="">-- 選擇成績表現 (排名) --</option>';
    currentClassData.scoreOptions.forEach(sc => {
      const scoreNum = Number(sc);
      if (!isNaN(scoreNum) && scoreNum <= currentItemLimit) {
        scoreOptionsHtml += `<option value="${sc}">${sc}</option>`;
      }
    });

    tr.innerHTML = `
      <td style="font-weight:bold; color:#64748b; text-align:center;" class="row-num">${rowIndex}</td>
      <td><select class="row-student" required>${studentOptionsHtml}</select></td>
      <td><select class="row-score" required>${scoreOptionsHtml}</select></td>
      <td><input type="text" class="row-note" placeholder="例如：進步獎 (選填)" /></td>
      <td style="text-align:center;"><button type="button" class="btn-del" onclick="removeRow(this)">刪除</button></td>
    `;

    tbody.appendChild(tr);
    updateRowNumbers();
  }

  function removeRow(btn) {
    const tbody = document.getElementById("recordTbody");
    if (tbody.rows.length <= 1) return alert("至少需保留一位學生！");
    btn.closest("tr").remove();
    updateRowNumbers();
  }

  function updateRowNumbers() {
    document.querySelectorAll("#recordTbody tr").forEach((r, idx) => {
      r.querySelector(".row-num").textContent = idx + 1;
    });
  }

  // ⭐ 提交整批名單並寫入試算表
  async function submitAllRecords() {
    const classId = document.getElementById("classSelect").value;
    const itemName = document.getElementById("itemSelect").value;
    const rows = document.querySelectorAll("#recordTbody tr");

    if (!classId || !itemName) return alert("請確認班級與填報項目已選取！");
    if (rows.length === 0) return alert("請至少新增一位獲獎學生！");

    if (rows.length > currentRemaining) {
      return alert(`本次填報人數 (${rows.length} 人) 超過尚有名額 (${currentRemaining} 人)！`);
    }

    const records = [];
    const currentBatchStudentIds = new Set();

    for (let i = 0; i < rows.length; i++) {
      const studentSel = rows[i].querySelector(".row-student");
      const scoreSel = rows[i].querySelector(".row-score");
      const noteInput = rows[i].querySelector(".row-note");

      const studentId = studentSel.value;
      const studentName = studentSel.options[studentSel.selectedIndex].dataset.name;
      const score = scoreSel.value;
      const note = noteInput.value.trim();

      if (!studentId) {
        alert(`第 ${i + 1} 列尚未選擇學生！`);
        studentSel.focus();
        return;
      }
      if (!score) {
        alert(`第 ${i + 1} 列學生【${studentName}】尚未選擇成績表現！`);
        scoreSel.focus();
        return;
      }

      if (currentBatchStudentIds.has(studentId)) {
        alert(`學生【${studentName} (${studentId})】在清單中被重複選取！請移除重複項目。`);
        return;
      }
      currentBatchStudentIds.add(studentId);

      if (currentAwardedIds.includes(studentId)) {
        alert(`學生【${studentName}】歷史先前已獲獎，不可重複提報！`);
        return;
      }

      records.push({ id: studentId, name: studentName, score: score, note: note });
    }

    if (!confirm(`即將送出【${itemName}】共 ${records.length} 筆學生評報至 ${classId} 班？`)) return;

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "寫入試算表中...";

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitScores",
          userEmail: currentUser.email,
          classId: classId,
          itemName: itemName,
          records: records
        })
      });
      const json = await res.json();

      if (json.status === "success") {
        alert(`填報成功！已寫入 ${json.count} 位學生成績至 ${classId} 班試算表。`);
        // 重新載入該班最新統計資料
        onClassSelected();
      } else {
        alert(`寫入失敗：${json.message}`);
      }
    } catch (e) {
      alert("傳輸發生異常，請稍後再試！");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "確認送出並寫入試算表";
    }
  }
</script>
